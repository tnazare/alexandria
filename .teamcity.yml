jobs:
  Job1:
    name: Java Compile
    steps:
      - type: maven
        name: Backend compile
        goals: compile
        pom-location: backend/pom.xml
        runner-arguments: -B -pl alexandria-api,alexandria-entities,alexandria-service -am
        maven-version: bundled-3-9
        jdk-home: '%env.JDK_25_0%'
    enable-dependency-cache: true
    runs-on: Linux-Small
  Job2:
    name: Java Verify
    dependencies:
      - Job1
    steps:
      - type: maven
        name: Verify
        goals: verify
        pom-location: backend/pom.xml
        jdk-home: '%env.JDK_25_0%'
    enable-dependency-cache: true
    runs-on: self-hosted
  Job3:
    name: Frontend Build
    steps:
      - type: node-js
        name: Build frontend
        node-version: '22'
        shell-script: |-
          npm ci
          npm run lint
          npm run test
          npm run build
        working-directory: frontend
    enable-dependency-cache: true
    runs-on: Linux-Small
  Job4:
    name: Package
    dependencies:
      - Job2
      - Job3
    steps:
      - type: maven
        name: Package backend JAR
        goals: package
        pom-location: backend/pom.xml
        runner-arguments: -B -DskipTests
        jdk-home: '%env.JDK_25_0%'
      - type: script
        name: Build frontend bundle
        script-content: |-
          cd frontend
          npm ci
          npm run build
          cd dist && zip -r ../frontend-dist.zip . && cd ..
    files-publication:
      - path: backend/alexandria-service/target/*.jar
        publish-artifact: true
      - path: frontend/frontend-dist.zip
        publish-artifact: true
    enable-dependency-cache: true
    runs-on: Linux-Small
  Job5:
    name: Backend Image
    dependencies:
      - Job4
    steps:
      - type: script
        name: Build and push backend image
        script-content: |-
          set -e
          IMAGE=ghcr.io/tnazare/alexandria-backend
          # Enable arm64 emulation + a buildx builder (idempotent).
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --use --name alx-builder 2>/dev/null || docker buildx use alx-builder
          echo "%GHCR_TOKEN%" | docker login ghcr.io -u tnazare --password-stdin
          if [ "%teamcity.build.branch%" = "main" ]; then
            # Multi-arch build pushes directly (buildx can't --load multi-platform).
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t "$IMAGE:%build.number%" -t "$IMAGE:latest" \
              --push backend
          else
            echo "Not on main — building amd64 only, no push"
            docker buildx build --platform linux/amd64 -t "$IMAGE:%build.number%" backend
          fi
          docker logout ghcr.io
    runs-on: self-hosted
  Job6:
    name: Frontend Image
    dependencies:
      - Job4
    steps:
      - type: script
        name: Build and push frontend image
        script-content: |-
          set -e
          IMAGE=ghcr.io/tnazare/alexandria-frontend
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --use --name alx-builder 2>/dev/null || docker buildx use alx-builder
          echo "%GHCR_TOKEN%" | docker login ghcr.io -u tnazare --password-stdin
          if [ "%teamcity.build.branch%" = "main" ]; then
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t "$IMAGE:%build.number%" -t "$IMAGE:latest" \
              --push frontend
          else
            echo "Not on main — building amd64 only, no push"
            docker buildx build --platform linux/amd64 -t "$IMAGE:%build.number%" frontend
          fi
          docker logout ghcr.io
    runs-on: self-hosted
  Job7:
    name: Deploy
    dependencies:
      - Job5
      - Job6
    parameters:
      DEPLOY_HOST: 168.138.77.174
      DEPLOY_USER: ubuntu
      DEPLOY_PATH: ~/alexandria
    steps:
      - type: script
        name: Deploy to Oracle VM
        script-content: |-
          set -eu
          # Guard: skip until a real deploy target is configured (Oracle VM pending).
          if [ "%DEPLOY_HOST%" = "REPLACE_WITH_VM_PUBLIC_IP" ]; then
            echo "DEPLOY_HOST not configured yet — skipping deploy (no-op)."
            exit 0
          fi
          # SSH key comes from the DEPLOY_SSH_KEY secret.
          install -m 700 -d ~/.ssh
          printf '%s\n' "%DEPLOY_SSH_KEY%" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Copy the prod compose file to the VM, then pull + up.
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            deploy/docker-compose.prod.yml \
            "%DEPLOY_USER%@%DEPLOY_HOST%:%DEPLOY_PATH%/docker-compose.yml"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "%DEPLOY_USER%@%DEPLOY_HOST%" \
            "cd %DEPLOY_PATH% && \
             echo '%GHCR_TOKEN%' | docker login ghcr.io -u tnazare --password-stdin && \
             ALEXANDRIA_TAG=%build.number% docker compose pull && \
             ALEXANDRIA_TAG=%build.number% docker compose up -d && \
             docker logout ghcr.io"
    runs-on: self-hosted
secrets:
  GHCR_TOKEN: credentialsJSON:d1a79813-5f3f-4590-ae4b-b4c873343637
  DEPLOY_SSH_KEY: credentialsJSON:383bfbbb-3c11-45ff-b524-f8ad54c10d11
