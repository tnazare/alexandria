spring:
  application:
    name: alexandria

  datasource:
    url: jdbc:postgresql://localhost:5432/alexandria
    username: alexandria
    password: alexandria

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.alexandria: DEBUG
    org.springframework.security: INFO
