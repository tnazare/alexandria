spring:
  application:
    name: alexandria

  datasource:
    url: jdbc:postgresql://localhost:5432/alexandria
    username: alexandria
    password: alexandria
    hikari:
      validation-timeout: 5000
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:${OIDC_ISSUER_URI:}}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:}

alexandria:
  oidc:
    issuer-uri: ${OIDC_ISSUER_URI}
    client-id: ${OIDC_CLIENT_ID}
  organization:
    default-id: ${ALEXANDRIA_DEFAULT_ORG_ID:00000000-0000-0000-0000-000000000001}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true
  info:
    build:
      enabled: true

logging:
  level:
    com.alexandria: DEBUG
    org.springframework.security: INFO
