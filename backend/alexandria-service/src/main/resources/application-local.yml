spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/alexandria
    username: alexandria
    password: alexandria

  jpa:
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/alexandria
          audiences: alexandria-client

alexandria:
  oidc:
    issuer-uri: http://localhost:9000/alexandria
    client-id: alexandria-client

logging:
  level:
    com.alexandria: DEBUG
    org.hibernate.SQL: DEBUG
