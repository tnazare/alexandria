spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    # TC_REUSABLE reuses a single PostgreSQL container across all test contexts (paired with
    # testcontainers.reuse.enable=true), avoiding a per-context container startup that can time out
    # under Docker resource contention.
    # Uses the pgvector image (jdbc:tc:pgvector:pg16) so migration V9's `CREATE EXTENSION vector`
    # succeeds — a plain postgres image would fail every context that runs Flyway.
    url: jdbc:tc:pgvector:pg16:///alexandria?TC_REUSABLE=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    hikari:
      # The suite loads many @SpringBootTest contexts, each with its own pool, all sharing one
      # reused PostgreSQL container. Cap each pool small so their combined connections stay well
      # under Postgres max_connections (100) — otherwise contexts fail with "too many clients".
      maximum-pool-size: 4
      minimum-idle: 0

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://issuer.example.com
          jwk-set-uri: https://issuer.example.com/.well-known/jwks.json
          audiences: test-client-id

alexandria:
  oidc:
    issuer-uri: https://issuer.example.com
    client-id: test-client-id
  organization:
    default-id: 00000000-0000-0000-0000-000000000001
