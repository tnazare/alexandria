spring:
  datasource:
    url: jdbc:tc:postgresql:16:///alexandria
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://issuer.example.com
          audiences: test-client-id

alexandria:
  oidc:
    issuer-uri: https://issuer.example.com
    client-id: test-client-id
  organization:
    default-id: 00000000-0000-0000-0000-000000000001
