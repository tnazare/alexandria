# Testcontainers reliability settings for the integration test suite.
# The suite spins up multiple @SpringBootTest contexts, each acquiring a PostgreSQL container via
# the tc: JDBC URL. On resource-constrained machines (e.g. a dev docker-compose stack running
# alongside the build), container/database startup can exceed the default wait. Enable container
# reuse and allow a generous startup window so context loads don't intermittently time out.
testcontainers.reuse.enable=true
