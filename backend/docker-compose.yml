services:
  postgres:
    # pgvector-enabled Postgres so `CREATE EXTENSION vector` (V9) succeeds in local dev and the
    # benchmark stack. Drop-in replacement for postgres:16 (R2.4).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: alexandria
      POSTGRES_USER: alexandria
      POSTGRES_PASSWORD: alexandria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alexandria"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
