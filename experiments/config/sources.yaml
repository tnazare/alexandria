# Pinned harvest sources for the real-skill superset.
#
# Each source is pinned to a commit `ref` so a re-harvest yields the identical set. The harvester
# walks the repo tree at that ref, takes every `**/SKILL.md` under `subpath`, parses frontmatter,
# records provenance (source_url, ref, license, sha256) per skill, skips-and-logs malformed, and
# de-dupes by (name, sha256). All skills are real (no synthetic padding tier anymore).
#
# The superset builder (build_superset.py) then freezes a deterministic 500-skill set from this pool
# and commits it as permanent data. anthropics/skills is listed first so its 19 curated skills are
# always included (they anchor recognizable gold labels); the bulk comes from
# antigravity-awesome-skills, which ships 4209 real SKILL.md files (MIT-licensed; individual skills
# carry their own `source:`/license in frontmatter, recorded per skill).

sources:
  - kind: github_repo
    owner_repo: anthropics/skills
    ref: 34040c9c568585f6929bedeaad110ad08f079624   # pinned 2026-09-10
    subpath: skills
    tier: real
    license: UNKNOWN          # repo ships a non-SPDX license file; recorded per-skill as declared
    priority: 1               # always include these first in the superset
    exclude_slugs: []

  - kind: github_repo
    owner_repo: ar27111994/antigravity-awesome-skills
    ref: a9acd9c0c727224b94c418824197383a6f64bf94   # pinned 2026-09-30
    subpath: ""               # SKILL.md files live under plugins/.../skills/ and skills/
    tier: real
    license: MIT              # repo license; per-skill `source:` recorded from frontmatter
    priority: 2               # fill the superset up to 500 from here (seeded, deterministic)
    exclude_slugs: []

# Superset: the permanent 500-skill pool. The smaller named subsets (close/random/sparse at 20/100)
# are deterministic selections FROM this frozen superset — see build_subsets.py.
superset:
  size: 500
  seed: 1234
