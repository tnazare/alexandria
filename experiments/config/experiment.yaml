# Skill Retrieval Benchmark — experiment configuration.
#
# Every value here is recorded into results/raw/<run-id>/env.json so a run is reproducible.
# The LLM is non-deterministic; seeds control everything else (corpus, padding, task order).

experiment_version: v1

# Primary independent variable: library sizes to test. Each is a full corpus (real + distractor +
# padding to reach the size). Reported metrics are a function of these (Requirement 2.3, 9.6).
library_sizes: [20, 100, 500]

# Repetitions per (task, condition, library_size) cell. Dispersion is reported over these
# (Requirement 6.2). The LLM varies run to run; nrep quantifies that.
nrep: 5

# Warm-up runs per cell, excluded from primary statistics but retained+labeled (Requirement 6.5).
warmup: 1

# recall@K for the secondary accuracy metric (Requirement 5.3).
k: 5

# Seeds (Requirement 6.3, 7.6). padding_seed feeds the variant generator; order_seed shuffles tasks.
seeds:
  padding: 1234
  order: 5678

# Conditions to run. Any of: alexandria (server-side resolve+fetch), native (.claude/skills preload),
# catalog (resident compact catalog in-prompt + local on-demand fetch_skill(id); needs no stack).
# - [alexandria, native]  : the original server-side vs native comparison (needs the docker stack).
# - [catalog, native]     : resident-catalog vs native A/B (no stack; see results/run-20261002-095819.md).
# - [hierarchical, catalog, native] : three-way (hierarchical adds a category-open hop; no stack).
conditions: [alexandria, native]

# Model + effort under test. Both are pinned and recorded per run; a mid-experiment change
# invalidates results (Requirement 6.4). model_id accepts a CLI alias (opus/sonnet/fable) or a full
# model name; effort is one of low/medium/high/xhigh/max.
#
# Default: haiku + low. Skill retrieval is a tool-selection decision, not reasoning-hard, so the
# cheapest tier keeps the ~2000-invocation matrix affordable while staying a valid controlled
# variable (both conditions run under the identical model). For a more representative "typical Claude
# Code user" reported run, consider sonnet + medium. Note the near-variant-trap tasks are the ones a
# weaker model may fumble — but that affects both conditions equally, so the A/B comparison holds.
model_id: haiku
effort: low

# Tokenizer used for the client-independent Context_Token_Cost (Requirement 3.1). Fixed for all
# conditions. cl100k_base is a stable, widely-available encoding; it is a *comparable proxy*, not
# Claude's own tokenizer (see PROTOCOL threats-to-validity).
tokenizer_encoding: cl100k_base

# Alexandria stack + OIDC (local docker compose defaults).
alexandria:
  host: http://localhost:8080
  oidc_token_url: http://localhost:9000/alexandria/token
  oidc_client_id: alexandria-client
  oidc_client_secret: any          # mock OIDC accepts any secret (see manual-test docs 0.2)
  team_name: Benchmark Skills

# Claude Code CLI.
claude:
  command: claude
  output_format: json

# Standing "consult your skill library FIRST" directive, appended to the system prompt per condition
# (Option A / Option 2 wording). Without an instruction, no model spontaneously calls the retrieval
# tools for a natural task prompt (verified: Haiku AND Sonnet both call 0/3 un-instructed), and a
# soft instruction gives only ~50% compliance. So the directive is imperative ("You MUST ... before
# anything else") to push compliance toward 100%, making the token/latency/accuracy comparison clean
# rather than swamped by compliance noise. The two prompts are equivalent in force so the instruction
# stays a controlled variable. Compliance (did the agent actually consult?) is still recorded per run,
# so the "does the agent obey" observation falls out for free. This measures the mechanisms under a
# forced-consult regime — disclosed in the results.
#
# DECISION-ONLY: the benchmark measures skill *selection*, not task execution. So the directive also
# tells the agent to STOP after identifying/consulting the skill and NOT perform the task or create,
# write, run, or open any files. Without this the agent does the real work (generating files, opening
# a browser preview, etc.) — wasted tokens and side effects that leak out of the sandbox. Both
# conditions get the identical stop-after-selection constraint, so it stays a controlled variable.
system_prompt:
  alexandria: >
    IMPORTANT: Before doing anything else, you MUST call the resolve_skill tool with a query derived
    from the user's task to check for a reusable governed skill. This is mandatory even if you think
    you already know how to do the task. If resolve_skill returns any relevant candidate, you MUST
    then call fetch_skill on that candidate's skillVersionId. Then STOP: state which skill you would
    use and end your turn. Do NOT actually perform the task, and do NOT create, write, edit, run, or
    open any files or commands. If resolve_skill returns no relevant candidate, simply say so and stop.
  native: >
    IMPORTANT: Before doing anything else, you MUST check your available Skills for a relevant one
    that applies to the user's task and invoke it with the Skill tool. This is mandatory even if you
    think you already know how to do the task. After invoking the relevant Skill, STOP: state which
    skill you would use and end your turn. Do NOT actually perform the task, and do NOT create, write,
    edit, run, or open any files or commands. If no relevant Skill applies, simply say so and stop.
  catalog: >
    IMPORTANT: Below is a Skill Catalog listing reusable governed skills as "id: name — description".
    Before doing anything else, you MUST review it and decide whether one applies to the user's task.
    This is mandatory even if you think you already know how to do the task. If one applies, you MUST
    call the fetch_skill tool with that skill's id to get its instructions. Then STOP: state which
    skill you would use and end your turn. Do NOT actually perform the task, and do NOT create, write,
    edit, run, or open any files or commands. If no catalog skill applies, simply say so and stop.
  hierarchical: >
    IMPORTANT: Below is a Category Index of reusable governed skills, as "label (count): summary".
    Before doing anything else, you MUST review it and decide which category best fits the user's
    task. This is mandatory even if you think you already know how to do the task. Call the
    list_category tool with that category's label to see its skills (as "id: name — description"). If
    one applies, call the fetch_skill tool with that skill's id to get its instructions. Then STOP:
    state which skill you would use and end your turn. Do NOT actually perform the task, and do NOT
    create, write, edit, run, or open any files or commands. If no category or skill applies, simply
    say so and stop.
