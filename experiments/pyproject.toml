[project]
name = "skill-retrieval-benchmark"
version = "0.1.0"
description = "Reproducible benchmark: Alexandria MCP skill library vs native .claude/skills"
requires-python = ">=3.11"
dependencies = [
    "tiktoken==0.8.0",
    "httpx==0.27.2",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["harness"]
