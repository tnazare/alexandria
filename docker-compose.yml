services:
  heptastadion:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "9000:9000"
    environment:
      SERVER_PORT: 9000
      JSON_CONFIG: >
        {
          "interactiveLogin": true,
          "httpServer": "NettyWrapper",
          "tokenCallbacks": [
            {
              "issuerId": "alexandria",
              "tokenExpiry": 3600,
              "requestMappings": [
                {
                  "requestParam": "scope",
                  "match": "*",
                  "claims": {
                    "sub": "dev-user-001",
                    "email": "dev@alexandria.local",
                    "email_verified": true,
                    "name": "Dev User",
                    "preferred_username": "dev@alexandria.local",
                    "alexandria_role": "Org_Admin"
                  }
                }
              ]
            }
          ]
        }

  postgres:
    # pgvector-enabled Postgres so `CREATE EXTENSION vector` (V9) succeeds in local dev and the
    # benchmark stack. Drop-in replacement for postgres:16 (R2.4).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: alexandria
      POSTGRES_USER: alexandria
      POSTGRES_PASSWORD: alexandria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alexandria"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/alexandria
      SPRING_DATASOURCE_USERNAME: alexandria
      SPRING_DATASOURCE_PASSWORD: alexandria
      OIDC_ISSUER_URI: http://heptastadion:9000/alexandria
      OIDC_CLIENT_ID: alexandria-client
      ALEXANDRIA_SEARCH_MODE: ${ALEXANDRIA_SEARCH_MODE:-fts}
      # Use jwk-set-uri directly to avoid issuer mismatch between Docker internal
      # hostname (heptastadion) and browser-facing hostname (localhost)
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://heptastadion:9000/alexandria/jwks
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ""
    depends_on:
      postgres:
        condition: service_healthy
      heptastadion:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_OIDC_AUTHORITY: http://localhost:9000/alexandria
      VITE_OIDC_CLIENT_ID: alexandria-client
    depends_on:
      - backend

volumes:
  postgres_data:
